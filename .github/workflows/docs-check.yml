# Watched paths (design/behaviour only; keep in sync with scripts/check-pr-docs.mjs and docs/ci-docs-check.md):
# - index.html
# - src/**/*.css
# - src/**/*.jsx
# - src/**/*.js except src/blueprintData.js, src/implementationData.js, and src/localization.js
# - public/favicon*, public/apple-touch-icon*, and public/social-preview*
# - scripts/prerender.mjs
# - scripts/write-cname.mjs
# - scripts/generate-environment-favicons.mjs
# - vite.config.js
# Not watched: src/blueprintData.js, src/implementationData.js, src/localization.js, content validators, generated dist/
name: Docs check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure no-docs-needed label exists
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const name = 'no-docs-needed';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                color: '0E8A16',
                description:
                  'Skip the Docs check when a PR changes UI/build files but needs no docs/ update.',
              });
            }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: List changed files
        id: changed
        run: |
          git fetch --no-tags --prune --no-recurse-submodules \
            origin "${{ github.event.pull_request.base.sha }}"
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > changed-files.txt
          cat changed-files.txt

      - name: Require docs/ for watched UI changes
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          export CHANGED_FILES="$(cat changed-files.txt)"
          node scripts/check-pr-docs.mjs
