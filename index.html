    <style>
      /* Reserve the compact navbar layout on first paint; no entrance hide. */
      .concept-nav {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 52px;
        width: calc(100% - 48px);
        max-width: 1232px;
        height: 64px;
        margin: 0 auto;
        padding: 16px 0;
        position: sticky;
        top: 0;
        z-index: 40;
        background: var(--page-bg, #ffffff);
      }
      .concept-nav .concept-brand {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        flex: 0 0 32px;
      }
      .concept-brand img {
        display: block;
        width: 32px;
        height: 32px;
        object-fit: contain;
        opacity: 1;
        visibility: visible;
      }
      .concept-brand-name {
        position: absolute;
        left: 40px;
        width: max-content;
        max-width: calc(100vw - 88px);
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .concept-nav > div { display: flex; gap: 30px; }
      .concept-nav > .concept-links,
      .concept-nav > .concept-utilities {
        opacity: 1;
        visibility: visible;
      }
      .concept-nav > .concept-links { flex: 1; align-items: center; }
      .concept-nav > .concept-utilities { margin-left: auto; gap: 8px; align-items: center; }
      .concept-menu-toggle { display: none; }
      @media (max-width: 760px) {
        .concept-nav { width: calc(100% - 32px); gap: 12px; }
        .concept-nav > .concept-links { display: none; }
        .concept-nav > .concept-utilities { gap: 4px; }
      }
    </style>
    <script>
      (() => {
        let returning = false;
        try {
          returning = sessionStorage.getItem("sde-v2-intro-seen") === "1";
          sessionStorage.setItem("sde-v2-intro-seen", "1");
        } catch { /* The first-visit motion also works without storage. */ }
        document.documentElement.dataset.load = returning ||
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ? "returning" : "first";
        try {
          const savedTheme = localStorage.getItem("sde-theme") || localStorage.getItem("sdb-theme");
          const theme = savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#121212" : "#ffffff";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
